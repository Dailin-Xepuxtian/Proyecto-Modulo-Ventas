<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giganet · Cotizaciones (prototipo)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#12263A',brand:'#0B6E78',brandd:'#084F57',mist:'#F2F5F7',line:'#CBD5DC',muted:'#465766'},fontFamily:{sans:['"IBM Plex Sans"','system-ui','sans-serif']}}}}</script>
<style>:focus-visible{outline:3px solid #0B6E78;outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
<body class="bg-mist text-ink font-sans min-h-screen">
<a href="#" id="skip" class="sr-only focus:not-sr-only focus:absolute focus:m-2 focus:p-3 focus:bg-white focus:rounded">Saltar al contenido</a>
<header id="top" class="bg-ink text-white"></header>
<main id="main" tabindex="-1" class="max-w-6xl mx-auto px-4 py-6 outline-none"></main>
<div id="aviso" role="status" aria-live="polite" class="fixed bottom-4 inset-x-4 sm:left-auto sm:max-w-sm z-50"></div>

<script>
/* ===== Estado y utilidades ===== */
const S={base:'http://localhost/giganet/public',token:null,user:null,demo:false,prods:[],cats:[],known:{},cart:{},cot:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=n=>'Q'+Number(n).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
const badge=t=>`<span class="inline-block text-xs text-muted bg-white border border-line rounded px-2 py-1">API: ${t}</span>`;
const btn='min-h-[44px] px-4 rounded font-medium bg-brand text-white hover:bg-brandd disabled:bg-line disabled:text-muted disabled:cursor-not-allowed';
const btn2='min-h-[44px] px-4 rounded font-medium border border-brand text-brandd bg-white hover:bg-mist';
const inp='w-full min-h-[44px] px-3 rounded border border-muted bg-white';
let t0;function aviso(m){clearTimeout(t0);$('#aviso').innerHTML=`<p class="bg-ink text-white rounded p-3 shadow">${esc(m)}</p>`;t0=setTimeout(()=>$('#aviso').innerHTML='',4500)}

/* ===== Datos de demostración (solo si la API no responde) ===== */
const MC=[[1,'CCTV y Videovigilancia'],[2,'Redes y Conectividad'],[3,'Telefonía IP y Comunicaciones']];
const MP=[[1,'HK-DS2CD2043G2','Cámara IP Bullet 4MP AcuSense','Hikvision',1,650,28],[2,'HK-DS7608NXI-K2','NVR 8 canales PoE 4K','Hikvision',1,1750,12],[3,'NL-SW24-POE','Switch 24 puertos Gigabit PoE+','Nextlink',2,2600,15],[5,'GS-GRP2602P','Teléfono IP HD 2 líneas PoE','Grandstream',3,425,50],[7,'UB-U6-PRO','Access Point UniFi 6 Pro','Ubiquiti',2,1350,32],[14,'HK-PTZ-2MP-25X','Cámara PTZ IP 2MP zoom 25X','Hikvision',1,null,0]]
 .map(([id_producto,codigo,nombre,marca,c,precio_venta,stock])=>({id_producto,codigo,nombre,marca,categoria:{id_categoria:c,nombre_categoria:MC[c-1][1]},precio_venta,stock,disponible:precio_venta!==null&&stock>0}));
function demo(p,o){
  const b=o.body;
  if(p==='/auth/login')return{token:'demo',tipo:'Bearer',expiraEn:3600,usuario:{nombre:'Asesor (demostración)',rol:'Asesor de Ventas'}};
  if(p==='/categorias')return MC.map(([id_categoria,nombre_categoria])=>({id_categoria,nombre_categoria}));
  if(p.startsWith('/productos')){const q=new URLSearchParams(p.split('?')[1]||''),c=q.get('id_categoria'),t=(q.get('codigo')||'').toLowerCase();
    return MP.filter(x=>(!c||x.categoria.id_categoria==c)&&(!t||(x.codigo+x.nombre).toLowerCase().includes(t)))}
  if(p==='/cotizaciones'){
    let c=0;const items=b.items.map(i=>{const pr=MP.find(x=>x.id_producto===i.productoId),s=Math.round(pr.precio_venta*100)*i.cantidad;c+=s;
      return{producto:pr,cantidad:i.cantidad,precioUnitario:pr.precio_venta,subtotal:s/100}});
    const iva=Math.round(c*.12),d=new Date().toISOString().replace(/\D/g,''),v=new Date(Date.now()+15*864e5);
    return{id:1,numeroCotizacion:'COT-'+d.slice(0,8)+'-'+d.slice(8,14),cliente:b.cliente,items,subtotal:c/100,iva:iva/100,total:(c+iva)/100,estado:'PENDIENTE',fechaVencimiento:v.toISOString().slice(0,10)}}
}
async function api(path,opt={}){
  if(!S.demo){
    try{
      const r=await fetch(S.base+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw Object.assign(new Error(j.mensaje||'Error'),{detalles:j.detalles||[],status:r.status});
      return j;
    }catch(e){if(e.status)throw e;S.demo=true;aviso('No hay conexión con la API: se muestran datos de demostración.')}
  }
  return demo(path,opt);
}

/* ===== Carrito ===== */
const items=()=>Object.entries(S.cart).map(([id,q])=>({p:S.known[id],q}));
const count=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
function tot(){let c=0;for(const{p,q}of items())c+=Math.round(p.precio_venta*100)*q;const i=Math.round(c*.12);return{sub:c/100,iva:i/100,total:(c+i)/100}}
const totales=t=>`<dl class="space-y-1 text-right"><div class="flex justify-between"><dt>Subtotal</dt><dd>${Q(t.sub)}</dd></div><div class="flex justify-between"><dt>IVA (12 %)</dt><dd>${Q(t.iva)}</dd></div><div class="flex justify-between text-lg font-semibold border-t border-line pt-2"><dt>Total</dt><dd>${Q(t.total)}</dd></div></dl>`;

/* ===== Encabezado ===== */
function header(){
  $('#top').innerHTML=`<div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
   <span class="font-semibold text-lg mr-auto">Giganet <span class="font-normal opacity-90">Cotizaciones</span></span>
   ${S.token?`<nav aria-label="Principal" class="flex items-center gap-1">
     <a class="min-h-[44px] px-3 inline-flex items-center rounded hover:bg-brandd" href="#/catalogo">Catálogo</a>
     <a class="min-h-[44px] px-3 inline-flex items-center rounded hover:bg-brandd" href="#/carrito">Carrito (${count()})</a>
     <button data-act="salir" class="min-h-[44px] px-3 rounded hover:bg-brandd">Salir</button></nav>
     <span class="text-sm w-full sm:w-auto">${esc(S.user?.nombre||'')}${S.demo?' · modo demostración':''}</span>`:''}</div>`;
}

/* ===== Pantallas ===== */
function vLogin(){
  $('#main').innerHTML=`<section class="max-w-md mx-auto bg-white border border-line rounded p-6">
   <h1 class="text-2xl font-semibold mb-1">Iniciar sesión</h1><p class="text-muted mb-4">Ingresa con tu cuenta de asesor o administrador.</p>
   <form id="f" class="space-y-4" novalidate>
    <div><label for="em" class="block font-medium mb-1">Correo electrónico</label><input id="em" type="email" autocomplete="username" required class="${inp}" value="kquinteros@giganet.com.gt"></div>
    <div><label for="pw" class="block font-medium mb-1">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required class="${inp}" value="Manager1"></div>
    <details><summary class="cursor-pointer min-h-[44px] flex items-center text-brandd">Servidor de la API</summary><label for="ba" class="sr-only">URL base de la API</label><input id="ba" class="${inp}" value="${esc(S.base)}"></details>
    <div id="err" role="alert"></div>
    <button class="${btn} w-full">Entrar</button>
   </form><p class="mt-4">${badge('POST /auth/login')}</p></section>`;
  $('#f').onsubmit=async e=>{e.preventDefault();S.base=$('#ba').value.replace(/\/$/,'');
    try{const r=await api('/auth/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value}});
      S.token=r.token;S.user=r.usuario;location.hash='#/catalogo'}
    catch(x){$('#err').innerHTML=errBox(x)}}
}
const errBox=x=>`<div class="border border-red-800 bg-red-50 text-red-900 rounded p-3"><p class="font-medium">${esc(x.message)}</p>${(x.detalles||[]).length?`<ul class="list-disc ml-5">${x.detalles.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}</div>`;

async function vCat(){
  $('#main').innerHTML=`<h1 class="text-2xl font-semibold mb-4">Catálogo de productos</h1>
   <form class="grid sm:grid-cols-[1fr_16rem] gap-3 mb-2" role="search" onsubmit="return false">
    <div><label for="q" class="block font-medium mb-1">Buscar por nombre o código</label><input id="q" type="search" class="${inp}" placeholder="Ej. HK-DS2 o switch"></div>
    <div><label for="cat" class="block font-medium mb-1">Categoría</label><select id="cat" class="${inp}"><option value="">Todas</option></select></div>
   </form><p class="mb-4 flex flex-wrap gap-2">${badge('GET /categorias')} ${badge('GET /productos?id_categoria=&amp;codigo=')}</p>
   <p id="n" class="text-muted mb-3" aria-live="polite"></p><div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>`;
  S.cats=await api('/categorias');$('#cat').innerHTML+=S.cats.map(c=>`<option value="${c.id_categoria}">${esc(c.nombre_categoria)}</option>`).join('');
  let d;const load=async()=>{const q=new URLSearchParams();if($('#cat').value)q.set('id_categoria',$('#cat').value);if($('#q').value.trim())q.set('codigo',$('#q').value.trim());
    S.prods=await api('/productos'+(q.toString()?'?'+q:''));S.prods.forEach(p=>S.known[p.id_producto]=p);grid()};
  $('#q').oninput=()=>{clearTimeout(d);d=setTimeout(load,250)};$('#cat').onchange=load;load();
}
function grid(){
  $('#n').textContent=S.prods.length+' producto(s)';
  $('#grid').innerHTML=S.prods.length?S.prods.map(p=>`<article class="bg-white border border-line rounded p-4 flex flex-col">
   <div class="h-24 mb-3 rounded bg-mist grid place-items-center text-brandd text-3xl font-semibold" aria-hidden="true">${esc(p.marca?.[0]||'G')}</div>
   <h2 class="font-semibold">${esc(p.nombre)}</h2><p class="text-muted text-sm">${esc(p.codigo)} · ${esc(p.marca||'')} · ${esc(p.categoria.nombre_categoria)}</p>
   <p class="text-xl font-semibold mt-2">${p.precio_venta==null?'Consultar precio':Q(p.precio_venta)}</p>
   <p class="text-sm ${p.disponible?'text-muted':'text-red-800 font-medium'} mb-3">${p.disponible?p.stock+' en existencia':'Sin existencia'}${S.cart[p.id_producto]?` · ${S.cart[p.id_producto]} en la cotización`:''}</p>
   <button data-act="add" data-id="${p.id_producto}" class="${btn} mt-auto" ${p.disponible?'':'disabled'}>${p.disponible?'Agregar a la cotización':'No disponible'}</button></article>`).join('')
   :'<p class="col-span-full bg-white border border-line rounded p-6">No hay productos con esos filtros. Prueba con otra categoría o borra la búsqueda.</p>';
}
function vCart(){
  const it=items();
  $('#main').innerHTML=`<h1 class="text-2xl font-semibold mb-4">Carrito de cotización</h1>`+(it.length?`
   <ul class="bg-white border border-line rounded divide-y divide-line mb-4">${it.map(({p,q})=>`<li class="p-4 flex flex-wrap items-center gap-3">
     <div class="mr-auto"><p class="font-medium">${esc(p.nombre)}</p><p class="text-sm text-muted">${esc(p.codigo)} · ${Q(p.precio_venta)} c/u</p></div>
     <div class="flex items-center gap-1" role="group" aria-label="Cantidad de ${esc(p.nombre)}">
      <button data-act="menos" data-id="${p.id_producto}" class="${btn2} w-11 px-0" aria-label="Quitar una unidad">−</button>
      <output class="w-10 text-center font-medium" aria-live="polite">${q}</output>
      <button data-act="mas" data-id="${p.id_producto}" class="${btn2} w-11 px-0" aria-label="Agregar una unidad">+</button></div>
     <p class="w-28 text-right font-medium">${Q(p.precio_venta*q)}</p>
     <button data-act="quitar" data-id="${p.id_producto}" class="${btn2}">Eliminar</button></li>`).join('')}</ul>
   <div class="bg-white border border-line rounded p-4 max-w-sm ml-auto">${totales(tot())}
    <a href="#/cotizar" class="${btn} mt-4 w-full inline-flex items-center justify-center">Continuar con los datos del cliente</a></div>`
   :`<div class="bg-white border border-line rounded p-6"><p class="mb-3">Tu carrito está vacío. Agrega productos del catálogo para armar la cotización.</p><a href="#/catalogo" class="${btn} inline-flex items-center">Ir al catálogo</a></div>`);
}
function vCotizar(){
  if(!count()){location.hash='#/carrito';return}
  $('#main').innerHTML=`<h1 class="text-2xl font-semibold mb-4">Datos del cliente</h1>
   <div class="grid md:grid-cols-[1fr_20rem] gap-4 items-start">
   <form id="f" class="bg-white border border-line rounded p-4 grid sm:grid-cols-2 gap-4" novalidate>
    <div><label for="n1" class="block font-medium mb-1">Nombre</label><input id="n1" required autocomplete="given-name" class="${inp}"></div>
    <div><label for="n2" class="block font-medium mb-1">Apellido</label><input id="n2" required autocomplete="family-name" class="${inp}"></div>
    <div><label for="co" class="block font-medium mb-1">Correo electrónico</label><input id="co" type="email" required class="${inp}"></div>
    <div><label for="ni" class="block font-medium mb-1">NIT <span class="font-normal text-muted">(CF si no tiene)</span></label><input id="ni" class="${inp}" placeholder="1234567-8"></div>
    <div id="err" role="alert" class="sm:col-span-2"></div>
    <div class="sm:col-span-2 flex flex-wrap gap-3 items-center"><button class="${btn}">Generar cotización</button><a href="#/carrito" class="${btn2} inline-flex items-center">Volver al carrito</a>${badge('POST /cotizaciones')}</div>
   </form>
   <aside class="bg-white border border-line rounded p-4" aria-label="Resumen"><h2 class="font-semibold mb-2">Resumen (${count()} unidades)</h2>${totales(tot())}</aside></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();
    try{S.cot=await api('/cotizaciones',{method:'POST',body:{cliente:{nombre:$('#n1').value,apellido:$('#n2').value,correo:$('#co').value,nit:$('#ni').value},
      items:items().map(({p,q})=>({productoId:p.id_producto,cantidad:q}))}});S.cart={};location.hash='#/cotizacion'}
    catch(x){$('#err').innerHTML=errBox(x)}};
}
function vCot(){
  const c=S.cot;if(!c){location.hash='#/catalogo';return}
  $('#main').innerHTML=`<div class="flex flex-wrap items-center gap-3 mb-4"><h1 class="text-2xl font-semibold mr-auto">Cotización ${esc(c.numeroCotizacion)}</h1>
   <span class="bg-amber-100 text-amber-900 border border-amber-800 rounded px-3 py-1 font-medium">${esc(c.estado)}</span></div>
   <section class="bg-white border border-line rounded p-4 mb-4"><p><b>Cliente:</b> ${esc(c.cliente.nombre)} ${esc(c.cliente.apellido)} · ${esc(c.cliente.correo)}</p><p><b>Vence:</b> ${esc(c.fechaVencimiento)}</p></section>
   <div class="overflow-x-auto bg-white border border-line rounded mb-4"><table class="w-full text-left"><caption class="sr-only">Productos de la cotización</caption>
    <thead class="bg-mist"><tr><th scope="col" class="p-3">Producto</th><th scope="col" class="p-3">Cant.</th><th scope="col" class="p-3 text-right">Precio</th><th scope="col" class="p-3 text-right">Subtotal</th></tr></thead>
    <tbody class="divide-y divide-line">${c.items.map(i=>`<tr><th scope="row" class="p-3 font-normal">${esc(i.producto.nombre)}<br><span class="text-sm text-muted">${esc(i.producto.codigo)}</span></th><td class="p-3">${i.cantidad}</td><td class="p-3 text-right">${Q(i.precioUnitario)}</td><td class="p-3 text-right">${Q(i.subtotal)}</td></tr>`).join('')}</tbody></table></div>
   <div class="bg-white border border-line rounded p-4 max-w-sm ml-auto mb-4">${totales({sub:c.subtotal,iva:c.iva,total:c.total})}</div>
   <p class="flex flex-wrap gap-3 items-center"><a href="#/catalogo" class="${btn} inline-flex items-center">Crear otra cotización</a>${badge('GET /cotizaciones/{id}')}</p>`;
}

/* ===== Eventos y enrutador ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id,p=S.known[id],q=S.cart[id]||0;
  if(a.dataset.act==='salir'){S.token=null;S.cart={};S.cot=null;location.hash='#/login';return}
  if(a.dataset.act==='quitar'){delete S.cart[id]}
  else if(a.dataset.act==='menos'){q>1?S.cart[id]=q-1:delete S.cart[id]}
  else{ if(q+1>p.stock){aviso(`Solo hay ${p.stock} unidades de ${p.nombre}.`);return} S.cart[id]=q+1;aviso(p.nombre+' agregado a la cotización.')}
  header();a.closest('#grid')?grid():vCart();
});
$('#skip').onclick=e=>{e.preventDefault();$('#main').focus()};
function go(){
  const h=location.hash.replace('#/','')||'catalogo';
  if(!S.token&&h!=='login'){location.hash='#/login';return}
  ({login:vLogin,catalogo:vCat,carrito:vCart,cotizar:vCotizar,cotizacion:vCot}[h]||vCat)();
  header();window.scrollTo(0,0);$('#main').focus({preventScroll:true});
}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
